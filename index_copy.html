        for (const log of mockLogs) {
          await new Promise(r => setTimeout(r, 800));
          setLogs(prev => [...prev, log]);
        }
        setStage("Streaming Live Factory Data...");
        setTimeout(() => setRunning(false), 2000);
      };

      return (
        <div className="search-container">
          <div className="search-label"><div className="live-dot" /> Live Edge Inference Simulator</div>
          <div className="search-bar" style={{ marginBottom: 12 }}>
            <button className="search-btn" onClick={runDemo} disabled={running} style={{ width: "100%", textAlign: "center", padding: "12px", fontSize: "14px" }}>
              {running ? "Processing Edge Video..." : "Start Camera Stream Inference"}
            </button>
          </div>
          {stage && <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}><div className="spinner" /><span className="status-text">{stage}</span></div>}
          
          {logs.length > 0 && (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {logs.map((l, i) => (
                <div key={i} className="result-row" style={{ animationDelay: `0.1s`, borderLeft: `3px solid ${l.status === 'success' ? 'var(--success)' : l.status === 'warning' ? 'var(--accent)' : '#D32F2F'}` }}>
                  <div style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 11, color: "var(--muted)", width: 60 }}>{l.time}</div>
                  <div style={{ flex: 1 }}>
                    <div className="result-title">{l.event}</div>
                    <div className="result-tags"><span className="result-tag">{l.cam}</span></div>
                  </div>
                  <div className="result-score" style={{ color: l.status === 'success' ? 'var(--success)' : l.status === 'warning' ? 'var(--accent)' : '#D32F2F' }}>Risk: {l.risk}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function Slide7() {
      const steps = [
        {
          n: 1, title: "Edge Video Ingestion", tag: "Hardware Layer",
          desc: "Industrial PoE cameras stream 1080p/30FPS video directly to the localized NVIDIA RTX 4080 Edge Server via LAN. No video ever leaves your factory floor.",
        },
        {
          n: 2, title: "Skeletal Pose Estimation", tag: "AI Vision Layer",
          desc: "Our TensorRT-accelerated MediaPipe BlazePose models map 33-point geometric skeletal meshes onto workers in real-time, tracking joint angles, posture, and movement velocity.",
        },
        {
          n: 3, title: "Instant Anomaly Alerting", tag: "HRMS Backend Layer",
          desc: "When the AI detects extreme motor impairment, collapsing, or fatigue, the FastAPI backend instantly pushes a sub-second alert to the HR Dashboard for immediate intervention.",
        },
      ];
      
      const outcomes = [
        { icon: "⚡", text: "Sub-second inference with zero cloud latency" },
        { icon: "🛡️", text: "100% Privacy compliant (Edge-only processing)" },
        { icon: "🚫", text: "Zero physical wearables required for workers" },
      ];

      return (
        <div style={{ padding: "36px 40px", height: "100%", display: "flex", flexDirection: "column" }}>
          <div className="section-eyebrow">Computer Vision Pipeline</div>
          <h2 className="slide-title">Transforming Live Video Into <span className="title-accent">Safety Intelligence</span></h2>
          <div className="divider" style={{marginBottom: 16}} />
          <p style={{ fontSize: 14.5, color: "var(--muted)", marginBottom: 16, lineHeight: 1.65 }}>
            Standard factory CCTV is reactive—you only check it <em>after</em> an accident happens. We deploy an active Edge-AI architecture that monitors the skeletal geometry of your workforce in real-time to prevent incidents before they escalate.
          </p>
          
          <div style={{ display: "flex", flexDirection: "column", gap: 9, marginBottom: 18 }}>
            {steps.map((s, i) => (
              <div key={i} className="step-row" style={{padding: "10px 16px"}}>
                <div className="step-num-box" style={{width: 30, height: 30, fontSize: 13}}>{s.n}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 2 }}>
                    <div className="step-title" style={{fontSize: 13.5}}>{s.title}</div>
                    <span className="tag" style={{ fontSize: 9, padding: "2px 6px" }}>{s.tag}</span>
                  </div>
                  <p style={{ margin: 0, fontSize: 13.5, color: "var(--muted)", lineHeight: 1.5 }}>{s.desc}</p>
                </div>
              </div>
            ))}
          </div>

          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 16 }}>
            {outcomes.map((o, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, background: "var(--bg2)", border: "1px solid var(--border)", borderRadius: 7, padding: "8px 12px", fontSize: 12.5, color: "var(--text)", flex: 1, minWidth: 160 }}>
                <span style={{ fontSize: 16 }}>{o.icon}</span>
                <span style={{ fontWeight: 600 }}>{o.text}</span>
              </div>
            ))}
          </div>

          {/* Inject the new AI Simulator here */}
          <div style={{marginTop: "auto"}}>
             <LiveInferenceDemo />
          </div>
        </div>
      );
    }


    function Slide8() {
      const deliverables = [
        { icon: "🎥", title: "Live Skeletal Tracking Demo", text: "Before you sign the final contract, we will set up a live webcam demonstration showing our MediaPipe BlazePose AI tracking human posture and macro-movements in real-time." },
        { icon: "🏭", title: "Edge Hardware Feasibility", text: "We will map out exactly where the 6 PoE cameras should be placed on your specific factory floor plan to eliminate blind spots and ensure 90%+ AI accuracy." },
        { icon: "🛡️", title: "Investment Protection", text: "By proving the AI's real-time capability via a live demo first, you have zero financial risk. You only proceed when you are 100% confident in the technology." },
      ];
      return (
        <div style={{ padding: "36px 40px" }}>
          <div className="section-eyebrow">Engagement Structure</div>
          <h2 className="slide-title">Phase 0: <span className="title-accent">The Live Micro-PoC</span></h2>
          <div className="divider" />
          <p style={{ fontSize: 16, color: "var(--muted)", marginBottom: 20, lineHeight: 1.7 }}>
            <strong style={{ color: "var(--text)" }}>Seeing is Believing.</strong> We don't expect you to invest ₹22 Lakhs on theory. Our Phase 0 engagement proves our real-time computer vision capabilities directly to your leadership team.
          </p>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(230px,1fr))", gap: 12, marginBottom: 18 }}>
            {deliverables.map((d, i) => (
              <div key={i} className="deliverable-card">
                <div className="del-icon-box">{d.icon}</div>
                <div><div className="del-title">{d.title}</div><div className="del-text">{d.text}</div></div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function Slide9() {
      const [checked, setChecked] = useState([false, false, false, false]);
      const actions = [
        { action: "Approval of the Phase 0 Audit Proposal", owner: "Client Leadership", day: "Day 1" },
        { action: "Signing of NDA", owner: "Both Parties", day: "Day 1" },
        { action: "Provision of Read-Only system access to relevant databases/APIs", owner: "Client IT Team", day: "Day 2–3" },
        { action: "Day-1 Kickoff of the 14-Day Technical Audit", owner: "Inzeph Engineering Team", day: "Day 3" },
      ];
      const toggle = i => setChecked(c => { const n = [...c]; n[i] = !n[i]; return n; });
      return (
        <div style={{ padding: "36px 40px" }}>
          <div className="section-eyebrow">Let's Begin</div>
          <h2 className="slide-title">Immediate <span className="title-accent">Next Steps</span></h2>
          <div className="divider" />
          <p style={{ fontSize: 16, color: "var(--muted)", marginBottom: 20 }}>Click each item to track confirmation status.</p>
          <div style={{ display: "flex", flexDirection: "column", gap: 9, marginBottom: 24 }}>
            {actions.map((a, i) => (
              <div key={i} className={`action-row ${checked[i] ? "done" : ""}`} onClick={() => toggle(i)}>
                <div className={`checkbox ${checked[i] ? "done" : ""}`}>&#10003;</div>
                <div style={{ flex: 1 }}>
                  <div className={`action-text ${checked[i] ? "done" : ""}`}>{a.action}</div>
                  <div className="action-owner">{a.owner}</div>
                </div>
                <div className="day-tag">{a.day}</div>
              </div>
            ))}
          </div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
            {/* <button className="btn-primary">Proceed to Phase 0 →</button> */}
            {/* <button className="btn-outline">Download Proposal</button> */}
            <span style={{ fontSize: 13, color: "var(--muted)", marginLeft: 4 }}>
              Questions? <strong style={{ color: "var(--navy)" }}>nandha@inzeph.com</strong>
            </span>
          </div>
        </div>
      );
    }

    const SLIDES_COMPS = [Slide1, Slide2, Slide3, Slide4, Slide5, Slide7, Slide8, Slide9];

    function App() {
      const [current, setCurrent] = useState(0);
      const [animKey, setAnimKey] = useState(0);

      const goTo = idx => {
        if (idx < 0 || idx >= SLIDES_COMPS.length) return;
        setCurrent(idx); setAnimKey(k => k + 1);
      };

      useEffect(() => {
        const h = e => {
          if (e.key === "ArrowRight" || e.key === "ArrowDown") goTo(current + 1);
          if (e.key === "ArrowLeft" || e.key === "ArrowUp") goTo(current - 1);
        };
        window.addEventListener("keydown", h);
        return () => window.removeEventListener("keydown", h);
      }, [current]);

      const SlideComp = SLIDES_COMPS[current];
      const progress = ((current + 1) / SLIDES_COMPS.length) * 100;

      return (
        <React.Fragment>
          <style>{STYLES}</style>
          <div className="root">
            <div className="topbar">
              <button className="logo" onClick={() => goTo(0)}>IN<span>ZEPH</span></button>
              <div className="nav-dots">
                {SLIDES_COMPS.map((_, i) => (
                  <button key={i} className={`dot ${i === current ? "active" : ""}`} onClick={() => goTo(i)} title={SLIDE_LABELS[i]} />
                ))}
              </div>
              <div className="slide-counter">{String(current + 1).padStart(2, "0")} / {String(SLIDES_COMPS.length).padStart(2, "0")}</div>
            </div>

            <div className="slide-wrap">
              <div key={animKey} className="slide-body">
                <SlideComp goTo={goTo} />
              </div>
              {current > 0 && <button className="arrow-btn" style={{ left: 8 }} onClick={() => goTo(current - 1)}>&#8249;</button>}
              {current < SLIDES_COMPS.length - 1 && <button className="arrow-btn" style={{ right: 8 }} onClick={() => goTo(current + 1)}>&#8250;</button>}
            </div>

            <div className="bottombar">
              <div className="slide-label">{SLIDE_LABELS[current]}</div>
              <div className="progress-track"><div className="progress-fill" style={{ width: `${progress}%` }} /></div>
              <div className="nav-hint">← → to navigate</div>
            </div>
          </div>
        </React.Fragment>
      );
    }

    // Render the app using ReactDOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
